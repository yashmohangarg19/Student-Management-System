<!DOCTYPE html>
<html ng-app="studentApp">
<head>
  <meta charset="UTF-8">
  <title>Student Record Management</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="script.js"></script>
</head>
<body ng-controller="StudentController">

  <div class="container">
    <h2>👨‍🎓 Student Management</h2>

    <input type="text" ng-model="student.name" placeholder="Name">
    <input type="email" ng-model="student.email" placeholder="Email">
    <input type="text" ng-model="student.phone" placeholder="Phone Number">

    <button ng-click="addStudent()">Add Student</button>

    <h3>📄 Student List</h3>
    <table>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>
      <tr ng-repeat="stu in students">
        <td>{{$index + 1}}</td>
        <td>{{stu.name}}</td>
        <td>{{stu.email}}</td>
        <td>{{stu.phone}}</td>
        <td>
          <button ng-click="editStudent($index)">Edit</button>
          <button ng-click="deleteStudent($index)">Delete</button>
        </td>
      </tr>
    </table>
  </div>

</body>
</html>
